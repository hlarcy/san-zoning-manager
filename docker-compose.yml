services:
  zoning-manager:
    build: .
    image: arc/san-zoning-manager:1.0
    container_name: san-zoning-manager
    restart: unless-stopped
    # Bound to this machine only. Change to "8080:8080" to share it on your network.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 1 = only connect to switches whose SSH host keys are in ./data/known_hosts
      STRICT_HOST_KEY_CHECKING: "0"
      KNOWN_HOSTS_FILE: /data/known_hosts
    volumes:
      - ./data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
